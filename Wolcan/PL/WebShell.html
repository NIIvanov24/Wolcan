<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolcan - Volcanic Isle</title>
<style>
    :root { color-scheme: dark; background: #120c0b; color: #f5dfc0; font: 15px system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(100%, 1280px, calc((100vh - 3rem) * 16 / 9)); }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #1d110e; image-rendering: pixelated; }
    footer { display: flex; justify-content: space-between; gap: 1em; padding: .55em 1em; align-items: center; }
    button { background: #422719; border: 1px solid #98613b; color: inherit; padding: .25em .65em; }
    canvas:fullscreen { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<main>
    <canvas id="canvas" tabindex="0" aria-label="Wolcan gameplay" oncontextmenu="event.preventDefault()"></canvas>
    <footer><span id="status" role="status">Loading Wolcan...</span><button id="fullscreen" type="button">Fullscreen</button></footer>
</main>
<script>
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const setStatus = (message) => { status.textContent = message; };
    async function toggleFullscreen() {
        try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await canvas.requestFullscreen();
            canvas.focus();
        } catch {
            setStatus("Fullscreen is unavailable in this browser window.");
        }
    }
    var Module = {
        canvas,
        setStatus,
        wolcanFullscreenKey: "F11",
        wolcanReady: false,
        onRuntimeInitialized() {
            canvas.focus();
            Module.wolcanReady = true;
            setStatus("Click the game or press a key to enable sound.");
            const started = () => setStatus("");
            document.addEventListener("pointerdown", started, { once: true });
            document.addEventListener("keydown", started, { once: true });
        }
    };
    Module.setStatus = (message) => { if (!Module.wolcanReady) setStatus(message); };
    canvas.addEventListener("pointerdown", () => canvas.focus());
    canvas.addEventListener("keydown", (event) => {
        if (event.code === Module.wolcanFullscreenKey && !event.repeat) {
            event.preventDefault();
            toggleFullscreen();
        }
        if (/^F([1-9]|1[0-2])$/.test(event.code)
            || ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "PageUp", "PageDown",
                "Backspace", "Home", "End", "Tab"].includes(event.code)) {
            event.preventDefault();
        }
    });
    document.getElementById("fullscreen").addEventListener("click", toggleFullscreen);
</script>
{{{ SCRIPT }}}
</body>
</html>
